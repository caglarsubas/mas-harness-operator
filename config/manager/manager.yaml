apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-operator
  namespace: planeon-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-operator
    spec:
      automountServiceAccountToken: false
      serviceAccountName: harness-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: operator.local/harness-operator@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          args:
            - --watch-namespace=planeon-system
            - --health-probe-bind-address=0.0.0.0:8081
            - --leader-elect=true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 32Mi}
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {audience: "https://kubernetes.default.svc", expirationSeconds: 3600, path: token}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}}]}
