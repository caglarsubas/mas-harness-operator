---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-operator
  namespace: planeon-system
rules:
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - harness.planeon.ai
  resources:
  - harnessinstallations
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - harness.planeon.ai
  resources:
  - harnessinstallations/finalizers
  - harnessinstallations/status
  verbs:
  - get
  - patch
  - update
