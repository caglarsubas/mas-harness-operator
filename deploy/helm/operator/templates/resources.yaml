apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness-operator
  namespace: {{ .Values.watchNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: harness-operator
  namespace: {{ .Values.watchNamespace }}
rules:
  - apiGroups: ["harness.planeon.ai"]
    resources: ["harnessinstallations"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["harness.planeon.ai"]
    resources: ["harnessinstallations/status", "harnessinstallations/finalizers"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: harness-operator
  namespace: {{ .Values.watchNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: harness-operator
subjects:
  - kind: ServiceAccount
    name: harness-operator
    namespace: {{ .Values.watchNamespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-operator
  namespace: {{ .Values.watchNamespace }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: harness-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-operator
    spec:
      automountServiceAccountToken: false
      serviceAccountName: harness-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --watch-namespace={{ .Values.watchNamespace }}
            - --health-probe-bind-address={{ .Values.healthProbeBindAddress }}
            - --leader-elect={{ .Values.leaderElect }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: https://kubernetes.default.svc
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
---
apiVersion: v1
kind: Service
metadata:
  name: harness-operator-health
  namespace: {{ .Values.watchNamespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: harness-operator
  ports:
    - name: health
      port: 8081
      targetPort: health
