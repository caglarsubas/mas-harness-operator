apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness-bundle-verifier
  namespace: {{ .Values.namespace }}
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: harness-bundle-verifier-deny-all
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: harness-bundle-verifier
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: batch/v1
kind: Job
metadata:
  name: harness-bundle-verifier
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harness-bundle-verifier
    spec:
      automountServiceAccountToken: false
      serviceAccountName: harness-bundle-verifier
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: verifier
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          args:
            - --request
            - /inputs/request/request.json
            - --observation
            - /inputs/observation/observation.json
            - --bundle-root
            - /inputs/bundle
            - --verification-time
            - {{ .Values.verificationTime | quote }}
            - --output
            - /receipt/verification-receipt.json
          env:
            - name: TMPDIR
              value: /receipt/tmp
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: request
              mountPath: /inputs/request
              readOnly: true
            - name: observation
              mountPath: /inputs/observation
              readOnly: true
            - name: signed-bundle-and-trust
              mountPath: /inputs/bundle
              readOnly: true
            - name: receipt
              mountPath: /receipt
      volumes:
        - name: request
          configMap:
            name: {{ .Values.requestConfigMapName }}
            items:
              - key: request.json
                path: request.json
        - name: observation
          configMap:
            name: {{ .Values.observationConfigMapName }}
            items:
              - key: observation.json
                path: observation.json
        - name: signed-bundle-and-trust
          persistentVolumeClaim:
            claimName: {{ .Values.bundleClaimName }}
            readOnly: true
        - name: receipt
          emptyDir:
            sizeLimit: 32Mi
