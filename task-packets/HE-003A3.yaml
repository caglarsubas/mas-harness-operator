contracts: ["Accepted base is main dcaf26fdc4e80ba959d8a8e615794cbe17d4ed7f, tree f68a8673d38cc6eefb88dfd665c8d9bc015c688e, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F, HE-003A..D, HE-003A2 and HE-004A. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test.","Two new contract files, host-enforcement/contracts/i05-v4/{README.md,vectors.json}, byte-identical to harness-onion's architecture/i05-gate-channel-v4/ (MET-ENFORCE-030, merged as fd362f9e) and registered REGISTERED_BEFORE_USE for HE-003A3 in edge record v4 (MET-ENFORCE-032, merged as c69e55f); v4 pins the four v3 files R10 holds, so no v3 file changes; the model is pinned by digest in PROVENANCE; 21 contract files are pinned in tools/gate.py; i05-protocol is byte-identical (no wire change).","The observation (Q-A3-3, -13): effect-gate's WorkerObserver seam, default Unobserved (every BIND refused, as before), called at today's position after MANIFEST_REUSED and before the BIND record; the portable KernelObserver driver over the four-call KernelReads trait holds the five steps, the parsers, the numeric edges and the cause mapping; an in-memory bounded log; the PolicyGate's BINDs observed identically (Q-A3-4). Configuration format v3 refuses observedWorkers with v4's C01 text before the unknown-member check (Q-A3-1); tests convert v3 and I07 v3 configurations with v4's conversion in the confined fake_kernel module.","The Linux side (Q-A3-5, -6, -9, -10, -14, -15): gate-sys KernelRoot (O_PATH, only open_fixed) and FixedPath, a bounded plain-read helper, PidFd::open through the existing syscall, a zero-timeout poll; LinuxKernelReads holds only its two roots; serve opens KernelRoots::open_after_seal(sealed) before the stores (failure exits OBSERVER_ROOTS, 26) and attaches the observer itself. Gate rules: the confinement and caller rules by exact call forms, the start-up exceptions (including the one /sys/fs/cgroup call the linked-source rule's fs word would refuse), the wiring statements, MAIN_USES/BEFORE_SEAL_REFUSED/STAGES, and STRUCT-ANGLE with the struct-body fix, each with self-tests.","Declared earlier-test departures (Q-A3-2, Q-A3-A1): the earlier test files that build gates from configurations carrying observedWorkers change only their gate-building lines, to the conversion plus its fake kernel (including tests/file_support/mod.rs, robustness_i07.rs, answer_late.rs and substrate.rs by Q-A3-A1); the format tests move to v3; gate_status.rs's STAGES gains OBSERVER_ROOTS; every other earlier test file is byte-identical and every earlier test passes. Two further departures are declared: one start-up exception in the linked-source rule for the single KernelRoot::open_kernel_root(\"/sys/fs/cgroup\") call, with self-tests; Gate and PolicyGate are no longer Send (the observer is a Box<dyn WorkerObserver>; serve is single-threaded). The stale v2 wording in gate-tls's signed_config.rs comment and tests/gate_config.rs is carried to a later packet. The broker, containment and writer binaries and SBOMs are byte-identical. There is no ci/ change. No harness-onion model or validator text is copied: an 8-word span search, contract text excluded, finds no shared span."]
