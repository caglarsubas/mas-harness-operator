contracts: ["Accepted base is main 1a0c529cfa9333c507b21c03bb49bc5c5212d8ef, tree 8c1ae5e164d53879bb8baf1953b0b7be268b017b, holding every R10 packet through HE-004D1. Inherit the nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. Eleven contract files are added byte-identical to their edge record v6 and v7 rows (native-profile v1/v2 schemas, the v1-v3 history vectors, I06 v3's vectors, criteria and README, and native-profile v5's schema, vectors and README), 35 -> 46 pinned, with PROVENANCE's sections; no ci/ change, so no per-head owner approval; no package is added, removed or updated and nothing is downloaded.","D1's re-vendor (unit B1, Q-HE4D2-2 (a)): the capture schema load moves to native-profile v5 (the record stays v4), the seven host rules and fields leave capture_check.rs and capture.rs, D1's capture replay goes 312 -> 330 checks. Exactly four earlier test files change (tests/d1_support/mod.rs, observer_capture.rs, observer_capture_replay.rs, observer_capture_schema.rs), each keeping its original intent under v5; observer_d1_contracts.rs and every other earlier test file are byte-identical. MODEL_DEFINED's D1 section gains Amendment A2.","The ports (Q-HE4D2-1..11 (a)): record_check.rs (v4 check_record), qualification.rs (check_migration and v5 check_qualification with QualificationAccepted), i06_evidence.rs (I06 v1 SC00-SC15 under I06 v3's wrapper, EvidenceAccepted) and composition.rs (the DESIGN-B section 5 token; compose_production refuses fixture tokens and returns Unavailable(W02-PROD)). The replay is 413 checks (native 262, I06 151); X01-X04 run on the registered v3 positives. No runtime wiring: D2's logic is unreachable from serve, by construction (G-D2-5) and corroborated in both shipped binaries (G-D2-7, no D2 symbol; G-D1-16, the host-path scan).","Gate rules G-D2-1..12 with self-tests: the contracts (46), the embeddable allowlist, the two schema constants, the D2 logic group and isolation with the derived type set, the host-path literal, the binary symbol check, the tokens (no Self literals, getters only and each returning its own field, fields reached only by getter calls, a closed field-type list, cfg_attr derives read), the root constants; no child module of a logic module (PR review round 1, R1-6); R4-1 pins observer-sys's lib.rs, dirent.rs and Cargo.toml (kernel.rs's pin unchanged) and R1-5 counts the LinuxCapture and LinuxWire constructor forms in every spelling of the type's path to new, neither type renamed with as or named by a type item read at bracket depth 0, each named only in its own file and in serve, and both home files pinned whole (R1-7, R2-1, R3-1, R4-1; owner decision Q-D2-END). tools/test_gate.py's earlier cases change only where the contracts count, the logic-module set and the fixtures that must hold its files, the observer-sys pin set (R4-1), the native-profile schema constants, the root-constant exception tables, the serve and capture-caller counting of the qualified constructor forms (R1-5) and the report lines change. MODEL_DEFINED records R136-R147 and the points settled at build.","Live use waits for: HE-008 and W02-PROD (the profile, the signed endpoints, complete v1-v3 histories and NP-2's ledger, the I06 evidence record, the production backend profile); HE-004-I01 (retained captures, per-request freshness, the capture view's wire form); T04's four host proofs (T04-HOST-BOOT, T04-POLICY-STABLE, T04-HOST-LOCKS, T04-BOOT-ENTRY). No harness-onion model or validator text is copied: the 8-word span search (contract README prose no longer exempt) finds only identifiers and one run of regex escapes in added lines."]
