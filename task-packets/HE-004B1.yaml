contracts: ["Accepted base is main 930fdc67fd630705b775f6974820d90f751d9ae9, tree c3d876c87a5adce1e9753c785649a233d8bacefa, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F, HE-003A..D, HE-003A2, HE-004A and HE-003A3. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test.","Ten new contract files under host-enforcement/contracts/{i06-v2,i06-v1,admission-v3}/, byte-identical (sha256, length, mode 100644) to the ten HE-004 rows edge record v4 registers REGISTERED_BEFORE_USE (harness-onion MET-ENFORCE-032, merged as c69e55f): I06 v2 vectors, criteria and README; I06 v1 identity closure, writer inventory, upstream bootstrap RBAC v1.37.1 and README; admission v3 vectors, README and planeon-a2 manifest; 31 contract files are pinned in tools/gate.py and recorded in PROVENANCE; the models are read as specification and never copied.","The crate shape (Q-HE4B-6): B1's modules live in crates/observer/src (inputs, rbac, snapshot, operational, admission, and contracts.rs, the one module embedding contract bytes), #![forbid(unsafe_code)]; planeon-observer links i05-protocol (moved to [dependencies]; Cargo.lock unchanged, it already held the edge); BTreeMap/BTreeSet only; i05-protocol, effect-gate/src, gate-sys, gate and gate-tls are byte-identical, and planeon-gate's, the broker's, containment's and the writer's binaries and SBOMs are byte-identical.","The logic (design section 4): list inputs are (request spec, list) pairs from a closed set, refused when paged, mis-kinded, duplicated, mis-scoped or paired with another spec, NotServed only for MutatingAdmissionPolicy and its binding; the producer refuses LoopbackNonResource (a non-resource rule bound directly to User system:apiserver), AggregatedRole (OR03), DanglingRoleRef and Malformed, and counts dropped non-resource rules; the IC check follows the model's order with the nine tables' canonical digests pinned and per-row wiring tests; OR02/OR05/OR06 share their inputs; ADM-4 accepts only Kubernetes v1.37.1 and records planeon.internal.observer-adm4/v1 with its observation binding, encoded canonically and digested.","Gate rules (design section 6, with self-tests): CONTRACTS and PROVENANCE; OBSERVER_LINKED_CRATES += crates/i05-protocol; the observer post-seal word list over i05-protocol's sources with the single impl Drop for Value exception; the path-root whitelist for B1's modules; the contracts.rs include rule (seal.rs keeps HE-004A's two OBSERVER-program includes); the no-panic tripwire outside #[cfg(test)]; main.rs's grammar and tail unchanged. Carried from HE-003A3's PR review (monitor, 2026-10-17): R1-2 (the serve wiring rule refuses every later gate binding form) and R1-3 (the observer implementations pinned by path), with self-tests; R1-5, R1-6 and R1-7 as MODEL_DEFINED text; effect-gate/src is unchanged.","No earlier test file changes; every earlier test passes. Departures, each failing closed and recorded in MODEL_DEFINED (R98-R105): the i05-protocol parser's HashSet calls getrandom once per thread (in the OBSERVER row; a residual beyond the design's Drop-only one, for T04's trace); the 11 non-writable policy kinds use API version v1; lone surrogates are refused; unpinned IC texts are R10's own; the producer's binding order is fixed; an empty expected plugin is UNAVAILABLE and a malformed apiserverIdHash is recorded null. No harness-onion model or validator text is copied: an 8-word span search, contract text excluded, finds no shared span.","Transport change (owner decision Q-HE4B1-ZB (a), 2026-10-18): ci/zero_bill_scan.py exempts exactly two pinned upstream contract files, host-enforcement/contracts/admission-v3/admission-manifests/planeon-a2.json (sha256 1096b3cc71c4fe6b5a17ed61e8bf8c17ee17fcf52b192503534d60aed9ce4741) and host-enforcement/contracts/admission-v3/vectors.json (sha256 a3e2dc9818742ae2188e0e83cf91bb833be836115975b3fb23d5f280f6928cc1), from its two service-type patterns only (load-balancer and node-port), because the admission-v3 policy's own refusal rules name those service types; every other pattern still applies to them, and a changed byte or the same bytes at another path fail as before (tests/verify/test_zero_bill_scan.py, run by the inherited unittest command). Because ci/ changes, the head runs only after the owner approves it."]
