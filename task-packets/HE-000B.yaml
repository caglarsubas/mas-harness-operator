contracts: ["Inherit HE-000's three commands unchanged and in order, then add the repaired zero-bill scan and the tests/verify suite, both as python3 -I -B. Every later packet in this repository inherits all five in order.","Retire the prefetch target in all four places: the Makefile target and .PHONY entry, the OP-001 descriptor's target (ci/targets/op-001.json otherwise unchanged), ci/handlers/help.py, and ci/handlers/prefetch.py (deleted). The verifier never prefetches; no packet may list make prefetch. ci/validate_porting.py is no longer referenced and stays byte-identical and unexecuted; PORTING.yaml is untouched.","ci/zero_bill_scan.py: the deleted workflow's checks become 'no file under .github/workflows/' (any workflow is an Actions path and so a billing vector); the tree scan also reads .rs and .toml files and skips .git, every target/ and every __pycache__/ directory; the Containerfile and descriptor checks are unchanged.","tests/verify/test_security.py: TransportTests test the adopted runner (single inline JSON fields, shell, env and online argv refused, a changed packet refused, the exact execution contract, authority paths not forwarded and the six profile names forwarded) and never call the runner's printing entry points; SecurityTests are unchanged.","AGENTS.md rule 2 adds that packets are never removed or reverted; rule 5 keeps PORTING.yaml as the NO_AUTHORIZATION sentinel, lets Makefile, ci/run_make_target.py and the OP descriptors change only through an owner-decided packet, and names task-packets/<ID>.yaml under the owner-operated verifier as the acceptance route. .gitignore adds __pycache__/.","This packet changes ci/, so the verifier runs it only after the owner approves this exact head commit."]
