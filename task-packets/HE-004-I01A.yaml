contracts: ["Accepted base is main 49d52e0a2964b73c2e12023a75789467abf2d5b7, tree ddd689471acbe1e4feb5eff59fd0e933e69e4e1b, holding every R10 packet through HE-004D2. Inherit the nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. Four contract files are added byte-identical to their edge record v8 rows (seccomp-v5's OBSERVER.x86_64.bpf and OBSERVER.aarch64.bpf; I06 v4's criteria.json and vectors.json), 46 -> 50 pinned, with PROVENANCE's HE-004-I01a section; no ci/ change, so no per-head owner approval; no package is added, removed or updated and nothing is downloaded.","The listener (DESIGN-I01A sections 3-5, owner Q-HE4I1-1..13 and Q-I01A-1..9): the observer's seal embeds the seccomp-v5 OBSERVER programs (2,024 and 1,936 bytes, 253 and 242 instructions); gate-sys gains the safe listen_seqpacket_plain with no new foreign symbol; linux_listen.rs holds the opaque I01Socket (accept, creds, proc_open, proc_read, exe, alive, recv, close) and LinuxWire::new registers it; Client's wait_serving is the only wire wait and calls serve_peer_step once per ready I01 descriptor; listener faults back off 5 s and the twelfth in a row ends the epoch with status 35; statuses 31-35 are added.","The service (sections 6-8): one session at a time, idle bound 2 s, outer bound 900 s; custody from the enrolled record's server identity (label_matches, SCM_SECURITY compared exactly, the 0::/ cgroup line through same_lines, the exe rule from capture_class, the window [validFrom, expiresAt - 3 s) with its latch); framing, canonical JSON, the request schema and the request-side chain; the binding gate is absent in I01a, so every session closes and nothing is ever sent: PeerOps has no send. serve makes a thirteenth call, enrolled.server_identity().","The quota pair (section 9): the least-headroom covering key with its tie-break, floor(hard) and min(ceil(used), floor(hard)), and the 2^53-1 bound on the chosen key (status 89). One earlier assertion in tests/observer_quota.rs changes meaning by design: an edge with hard 2^53+2 whose headroom alone fits now refuses, and a hard of exactly 2^53-1 is shown passing beside it.","The role pin (section 10): observer_rbac.rs ports I06 v4's check_observer_snapshot in R10's own words and observe.rs calls it right after the closure check, with only the three list lets between; a refusal ends the epoch with status 87. The replay is 139 cases (I06 v4's 96 and v3's 43 on the v4 positive). The rig fixture tests/c_support/mod.rs leaves the observer's own I06 v2 positive entry out of positive_rbac, because under the pin the observer's grants come only from the contract role and binding (observer_grants); every other earlier test file is byte-identical except observer_seal.rs (v5) and observer_quota.rs (above).","Gate rules G-I01-1..6 with self-tests (never unlink, the one wait point and step, the I01 path, no send, the I01Socket shape under check_socket_items, the role-pin call site) and the role constants against I06 v4's objectsPositive; OBSERVER_HOME_PINS, DEBUG_HAZARDS, the no-panic and logic-module sets and OBSERVER_WIRING (13) follow. MODEL_DEFINED records the HE-004-I01a section, P1-P6 and R148-R160.","Live use waits for: HE-004-I01b (the answer and the binding), HE-008 (provisioning, the I06 v4 role and binding objects, the socket's RuntimeDirectory), U7's PV replay after edge v9 (contracts 50 -> 52), and T04's host proofs (an accepting peer on a Linux host, and a Linux run of gate-sys's listen_plain test, which every macOS run, the verifier's included, skips). No harness-onion model or validator text is copied: the 8-word span search finds only contract text (I06 v4's pinned refusal texts and rule data, which must be byte-exact)."]
deliverables: ["crates/observer's linux_listen, i01_service, i01_request and observer_rbac modules with the client, status, quota, seal, enrolled, observe and main changes; gate-sys's listen_seqpacket_plain; the four contract files and PROVENANCE's section; seven new test binaries (observer_i01_quota, observer_i01_request, observer_i01_role_pin, observer_i01_service, observer_i01_wait, observer_status_i01, gate-sys listen_plain, Linux-only) and the three changed earlier test files; gate rules G-I01-1..6 and the role-constants check with self-tests; MODEL_DEFINED's HE-004-I01a section."]
excluded: ["HE-004-I01b (the answer and the binding), U7 (the PV replay, edge v9), HE-005, HE-008, W02-PROD and the T04 items listed in MODEL_DEFINED; any ci/ change, dependencies and downloads."]
