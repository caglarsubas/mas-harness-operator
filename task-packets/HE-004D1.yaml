start + 25 s, the drain before the progress check, the expiry wake and latch; capture failures never exit; setup statuses 25-30.","Gate rules G-D1-1..16 with self-tests, including G-D1-16 (owner Q-HE4D1-D3 (a)): the binary host-path check gains, for planeon-observer only, one exempt span, the pinned v4 schema bytes, which must occur exactly once; HOST_PATHS is unchanged for every binary. The constructor is LinuxCapture::new (a word gate.py's OBSERVATION_CALLERS reserves was avoided), and G-D1-5's five private expressions are each excepted once from the fs scan, as R96 is. Every earlier test file is byte-identical except tools/test_gate.py, whose earlier cases change only where the observer's closure, the scanned and unsafe file lists, the foreign items, the start-up exceptions, the wiring order, the contracts count and the binary host-path check's one exempt span for planeon-observer change. MODEL_DEFINED records R120-R135 and the points settled at build.","Live use waits for: W03-PLAN-AMEND-3's OBS-HOSTPOL-1 (HE-008's host-policy share, T04's exact check) and NP-9 (HE-005's quiescent freeze); HE-008's signed v2 configuration and installed record; HE-004-I01 for the capturer's authentication (Q-HE4D1-10 (a)); HE-004D2 for check_qualification and the acceptance token. T04 confirms every kernel constant cited by name; until then a wrong but distinct value is the recorded residual. No harness-onion model or validator text is copied: the 8-word span search finds no shared span in new text other than an identifier."]
