contracts: ["Accepted base is main fa9df570e5de5096ae7bb6645e59e8d35b886965, tree 6eeaaee40cbfcec3ba594580b6b74e494a4d1c56, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F, HE-003A..D and HE-003A2. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test.","Two new contract files, host-enforcement/contracts/seccomp-v3/OBSERVER.{aarch64,x86_64}.bpf, byte-identical to harness-onion's architecture/compiled-filter-programs/programs/ (MET-ENFORCE-025, merged as 5da1265; the OBSERVER programs are the same bytes under seccomp allowlists v3 and v4) at the consumer paths edge records v2 and v3 register REGISTERED_BEFORE_USE for HE-004, consumed by HE-004A as HE-004's first part (Q-HE4A-4); 19 contract files pinned by sha256 in tools/gate.py and recorded in contracts/PROVENANCE.md.","The observer's seal (Q-HE4A-6, -7): crates/observer is a library and a binary without unsafe code, using gate-sys's role-neutral seal calls; a start state is accepted only when the bounding set already equals {CAP_NET_ADMIN, CAP_BPF} (matrix v5 gives the observer no setpcap), the permitted set holds both and the ambient set is empty; stage 1 sets the core limit to 0, the capability sets and no_new_privs with read-backs; stage 2 checks one thread and the final state and installs the embedded OBSERVER program (238 and 227 instructions) with TSYNC; the seal engine cannot drop a bounding capability or clear the ambient set, and the kernel refuses a bounding drop without CAP_SETPCAP; main runs stage 1, stage 2 and the pinned not-yet-serving exit (Q-HE4A-1 (b): no configuration in A; Q-HE4A-2 (a)).","Gate: tools/gate.py checks the observer's linked closure (crates/observer, crates/gate-sys), runs every linked-crate scan over the observer, an observer post-seal list over its code without comments (the words file, FileMode, sync, sync_all, sync_data, the lock family, write_at and write_all_at in any form, and Drop: PR review round 1, R1-1 and R1-4), the observer's seal grammar with the pinned tail, no membarrier in either binary, and each planeon-observer binary holding its architecture's OBSERVER program exactly once, each with self-test cases. SEC-4 for OBSERVER rests on the pinned programs present exactly once per binary, the post-seal and linked-source rules and T04's installed-filter proof; the observer wrapper inventory is the open item OBSERVER-WRAPPER-INVENTORY, its route the owner's call (Q-HE4A-B2 (a)). MODEL_DEFINED.md's HE-004A section records R86 onward and the carried HE-008/T04 items.","Unchanged: the gate's crates and every earlier test file are byte-identical and every earlier test passes; i05-protocol is a test-only dev-dependency of the observer (one Cargo.lock edge); the other binaries and SBOMs, planeon-gate included, are byte-identical. There is no ci/ change. No harness-onion model or validator text is copied: an 8-word span search over R10's sources, vendor/ excluded, finds no shared span."]
deliverables: ["contracts/seccomp-v3/OBSERVER.* and PROVENANCE; crates/observer (library, seal, status, main) and its tests; the gate's observer rules with self-test cases; MODEL_DEFINED.md's HE-004A section."]
