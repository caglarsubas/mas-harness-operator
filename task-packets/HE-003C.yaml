objective: "Build the effect gate's upstream half (harness-onion W03 plan v2, HE-003's third part after owner decision Q-HE3-1 (a); obligations I05-2, I05-3's client side and I07-6, with N15, R12, R15/HE003-REQ-1 and HE-002B R1-4; decisions Q-HE3C-1..7, 2026-10-15, by the lane monitor under the owner's delegation): the upstream port in the HE-003A loop, one apiserver exchange at a time with exactly one outcome (Response, LOST or TIMEOUT) under the real 900-second I05 and 10-second I07 bounds; a TLS 1.3 mutual client (rustls 0.23.46, ring provider, webpki against the configured serving CA with an IP SAN, no resumption, no early data, two client identities); strict HTTP/1.1 answer framing including chunked; identity extraction that fails closed where the model journals it; the audited client connect; and the loopback-only parsed apiserverAuthority. No new crate; main, the configuration, credential loading and linking are HE-003D's, so no binary links gate-tls yet."
