contracts: ["Accepted base is main 8ea617dd8eac13040ead7df065979c4e8913e698, tree 729e0765507472497b5192e54358ac6e6746b339, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F, HE-003A and HE-003B. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. No contract file changes: the 15 files stay pinned in tools/gate.py and PROVENANCE.md is unchanged.","Dependencies unchanged: no crate is added, vendored, removed or updated; Cargo.toml files, Cargo.lock, host-enforcement/vendor/ and licenses/vendor-crates.json (still pinned in tools/gate.py) are byte-identical to the base. Nothing is downloaded by any command.","Upstream port (DESIGN rev 2.1 §2): a start is armed in apply (I05, the staged request taken only with the matching Forward action id) or in sync (I07, through the provided GateView::forwarded_write) and runs from a zero start deadline; the bound is anchored at the arming and checked first, so a TIMEOUT wins a tie and a response completed after the bound is never fed; every failure after the start is LOST; a seal or session end closes the exchange and feeds nothing; I05 answers reach the model only through the exchange board's stage_response and I07 answers only through exchange::write_response, which turns an answer outside the I07 v3 patterns into LOST (HE003-REQ-1).","TLS client and framing (§3, §4; Q-HE3C-2..4, -6, -7): TLS 1.3 only, mutual, webpki verification against the configured serving CA with the IP address as server name, Resumption::disabled(), no early data, no SNI, ALPN http/1.1; the effect identity for I05 and the writer identity for I07; strict answer framing (Content-Length or chunked within 4 MiB decoded plus a raw cap, 101 and unknown 1xx refused, surplus refused); identity read where the model journals it (I05 GET 200, CREATE 201, DELETE 200/202 in the one form per kind; I07 success, the deleted object or the pinned v1 Status form), else None.","Code and gate: gate-sys tcp.rs gains connect and getsockopt (now exactly ten foreign items, constants evidenced from musl libc.a); effect-gate gains ConnectNet, NetTable::connect and LinuxConnector (both after the seal), GateView::forwarded_write, PendingWrite's rendered write and R16's loopback-only apiserverAuthority with apiserver_address() (Q-HE3C-1); i04.rs clears in_flight at relay start (R1-7) and fails the port on a relay with no connection; tools/gate.py keeps one TLS deny-list amended with the client hazards, counts the client's settings exactly once, requires the client auth and verifier calls once in tls_client.rs and keeps the UpstreamResponse construction in exchange.rs (Q-HE3C-5), each with self-test cases; MODEL_DEFINED.md's HE-003C section records R59-R68 and the T04/HE-008 carried list.","Unchanged and carried: HE-002's to HE-003B's test files are byte-identical and every earlier test passes; one in-source unit test (policy_gate.rs R16) changes for the loopback rule; the ten binaries and SBOMs are byte-identical (no binary links gate-tls). There is no ci/ change, so no per-head owner approval is needed. No harness-onion model or validator text is copied: an 8-word span search over R10's sources, vendor/ excluded, finds no shared span."]
deliverables: ["gate-tls upstream.rs, tls_client.rs, the http1.rs client framing and exchange::write_response; gate-sys tcp.rs connect; the effect-gate connector, GateView and R16 additions; the i04.rs R1-7 fix; the new gate-tls tests; the gate's new rules with self-test cases; MODEL_DEFINED.md's HE-003C section."]
