offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
contracts: ["Accepted base is main ed90a4782604678272065154d69d1ce426522321, tree e4bd0574d8e105ecc1370af18d439b85c3832428, holding HE-000, HE-000B, HE-001, HE-002, HE-002B and HE-002C. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test.","Two new contract files, host-enforcement/contracts/seccomp-v3/EFFECT_GATE.{aarch64,x86_64}.bpf, byte-identical to harness-onion's architecture/compiled-filter-programs/programs/ (MET-ENFORCE-025; the pinned v3 compiler's output, checked there against the v3 contract's filterDigests and programLengths) and registered REGISTERED_BEFORE_USE for HE-002S in the operator -> harness-engineering buildArtifact edge record v2 at 5da126570973293e1075459efe7cf99038f378c9; with the 13 files of v1 the 15 contract files are pinned by sha256 in tools/gate.py and recorded in contracts/PROVENANCE.md. The seal embeds both programs with include_bytes! and installs the running architecture's.","The seal (HE-002S design section 2 as amended by Q-HE2S-9 (a)): preconditions Threads: 1 in the process's own status file, read through gate-sys's read-only opener Dir::file_ro (Q-HE2S-5 (a); O_RDONLY, O_CLOEXEC, O_NOFOLLOW and O_NONBLOCK, so a FIFO planted at a name is refused without waiting for a writer, Q-HE2S-11 (a)), and uid and gid 0; stage 1, before any input: prlimit RLIMIT_CORE 0/0 (the gate stays dumpable, Q-HE2S-7 (a)), the ambient set cleared, the bounding set and capset reduced to CAP_SETPCAP within the start sets, no_new_privs (Q-HE2S-8 (a)), each read back; between the stages only the signed configuration's read and check (HE-003's); stage 2: Threads: 1 again, CAP_SETPCAP dropped, every set empty (the signed I04 port is at least 1024, Q-HE2S-9 (a), so nothing is kept), the final-state assertion, then seccomp SET_MODE_FILTER with TSYNC through syscall (317 on x86_64, 277 on aarch64), any non-zero return a failure. Every step and read-back failure is a typed SealError; HE-003's main exits on it. The accepted start states and the owner decisions are in host-enforcement/crates/effect-gate/MODEL_DEFINED.md's HE-002S section.","The gate's tripwires grow by reviewed rules (text, not Rust): unsafe may appear only in crates/gate-sys/src/openat.rs and crates/gate-sys/src/seal.rs; a per-file foreign-item allowlist (openat.rs declares openat, seal.rs exactly prlimit, prctl, capget, capset, getresuid, getresgid and syscall; no other linked file declares a foreign item; items private; no safe fn in an unsafe extern block; no link_name); the start-up lint's one exception, the single expression Dir::at(\"/proc/self\")?.file_ro(\"status\") in crates/gate-sys/src/seal.rs; a post-seal check that the linked sources of effect-gate, gate-sys and i05-protocol name none of the std APIs of design section 5's list (plus set_modified and is_terminal), whose system calls the program kills, with what the list does not name left to code review and T04; and HE-002C's carried R3-1 (inline assembly refused in its global_asm, naked_asm and renamed asm forms) and R3-4. tools/test_gate.py adds a case per rule. Owner decision Q-HE2S-3 (a), with C7 (HE-001's evidence copy instead of Q-HE2S-6 (a)'s download): the Rust 1.99.0 std paths the gate uses after the seal and the musl 1.2.5 libc.a symbols are re-checked from HE-001's rust-src evidence copy and recorded with source lines in MODEL_DEFINED.md. No harness-onion model or validator code or comment text is copied: an 8-word span search finds no shared span.","cargo test runs the seal against a fake kernel that models capset's subset rule and PR_CAPBSET_DROP's CAP_SETPCAP check: the plan's exact calls and arguments, the accepted and refused start states, a second thread at either stage, every call failing and every read-back wrong, EINVAL within 0..=40, a positive TSYNC return; the helpers; and the vendored programs (sha256, length, a classic-BPF decode: instruction count, the architecture check, x32 refusal on x86_64, the terminal RET KILL_PROCESS). The Linux run, the boot-time proof that the installed filter equals the published digest, and the per-thread checks are T04's. HE-002's, HE-002B's and HE-002C's test files are byte-identical and every earlier test passes. This packet does not change ci/, so no per-head owner approval is needed."]
deliverables: ["crates/effect-gate/src/seal.rs and crates/gate-sys/src/seal.rs with Dir::file_ro (O_NONBLOCK) and its FIFO test, the lib.rs changes, MODEL_DEFINED.md's HE-002S section, the seal and file_ro tests, the two vendored programs and PROVENANCE.md, and the gate's new rules with their self-test cases."]
excluded: ["The call site of the seal and the signed configuration (HE-003); the unit, its start state, SELinux and core handling (HE-008); the other roles' seals (HE-004 to HE-007); the Linux run and the boot-time digest proof (T04); ci/, the cargo config, Cargo manifests, the toolchain or closure table; downloads."]
