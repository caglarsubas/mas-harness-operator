objective: "Seal the effect gate's process (harness-onion W03 plan v2, item HE-002S, SEC-4 and HI-7 for EFFECT_GATE; owner decisions Q-HE2S-1 (a) to Q-HE2S-5 (a), Q-HE2S-7 (a) to Q-HE2S-11 (a) and C7, 2026-10-13, via the lane monitor): a two-stage seal as a library API (effect_gate::seal_stage1 and seal_stage2, a typestate over a crate-private engine) that sets the core limit to 0/0, clears the ambient set, reduces the bounding and capability sets to CAP_SETPCAP, sets no_new_privs, then, after only the signed configuration's read, checks the process is still single-threaded, empties every capability set, asserts the final state and installs exactly the published EFFECT_GATE seccomp program for the running architecture with TSYNC; the raw calls in gate-sys's second audited unsafe module (seal.rs); the two programs vendored byte-identically and embedded. No call site, no binary change: HE-003's main calls the seal."
