contracts: ["Accepted base is main ffa18d3013809ca245a66d1fd95e8a5ba4c4e285, tree 330ed0fa3f05acd868f537c236f78007f0cbdee0, holding every R10 packet through HE-004B1. Inherit the nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. No contract file changes (31 pinned, PROVENANCE unchanged); no ci/ change, so no per-head owner approval; no package is added, removed or updated and nothing is downloaded.","Placement (Q-HE4-5 (a)): the client lives in crates/observer as thirteen new modules plus changes to lib.rs, main.rs and status.rs, with the observer's own registry lines equal to gate-tls's and only the observer's new lock edges; gate-tls pieces are copied and adapted, with parity tests for the answer reader and the ClientHello. B1's five logic modules, contracts.rs and seal.rs are byte-identical, and so are effect-gate/src, gate-sys, gate, gate-tls and i05-protocol; planeon-gate's, the broker's, containment's and the writer's binaries and SBOMs are byte-identical. No new unsafe code: linux_net.rs uses gate-sys's existing calls behind a constructor taking the observer's &Sealed.","Behaviour (design sections 2 and 4-14): exactly 127.0.0.1 or ::1; TLS 1.3 only, mutual, no resumption; bounded readers and a streaming metrics reader; snapshots at one resourceVersion with every answer checked; watches as detectors with the progress rule (a fresh resourceVersion every 60 s, every stream past it within 150 s, three stale snapshots exit 98, a 210 s bound, monotone marks); OR07 polled to the first 200 within 300 s; restarts through process_start_time_seconds; ADM-4 re-checked every 60 s by B1's check_loaded_manifest; quota compared exactly; a byte-aware expansion guard (exit 99) and a node cap before parsing; the configuration read after seal stage 2 with its lifetime checked after load and parse; distinct exit statuses 80-99.","Gate rules G1-G11 with self-tests: the observer's two TLS groups and deny-list, the observer socket module, serve's eight-call order and tail, the key include, R1-3's contracts.rs pin, the no-panic tripwire over main.rs and status.rs as well, connection-path symbols in the shipped binary (rustls client-handshake symbols, as LTO inlines ClientConnection, recorded in R118) and the secret-type Debug rule. Every earlier test file is byte-identical except tools/test_gate.py, whose earlier cases change only where the observer's site, the TLS groups, the socket files and the include rule change. MODEL_DEFINED records R106-R119 and the points settled at build.","Live use waits for: an I06 successor naming the read grants (Q-HE4-6, with the owner-accepted residual that listing Secrets returns their data, re-assessed at HE-004-I01) and HE-008 provisioning them; HE-008's signer key, configuration and credentials (CN=planeon:policy-observer only, clientAuth EKU); HE-004-I01 for the ADM-4 record's exit. No harness-onion model or validator text is copied: an 8-word span search over the change finds no shared span."]
deliverables: ["crates/observer's client, configuration, credentials, TLS, HTTP, exposition, watch, request, quota, observe and socket modules and the binary's serve path; the eleven new test binaries; the gate rules with self-tests; MODEL_DEFINED's HE-004C section; README's observer row and NOTICE."]
excluded: ["HE-004-I01 (the observer's listener and the ADM-4 record's exit), HE-004D1/D2, HE-008 (keys, configuration, credentials, grants, units, host policy) and the T04 items listed in MODEL_DEFINED; any ci/ change, dependencies and downloads."]
