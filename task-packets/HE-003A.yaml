objective: "Build the effect gate's channel substrate (harness-onion W03 plan v2, HE-003's first part after owner decision Q-HE3-1 (a); obligations I05-6, I07-5 and SEL-5; owner decisions Q-HE3-3 (a), Q-HE3-4 (a), Q-HE3A-1 (c) with Q-HE3A-1b (a), and Q-HE3A-2 (b) to Q-HE3A-5 (a), 2026-10-14, via the lane monitor): the AF_UNIX SOCK_SEQPACKET listeners for I05 and I07 labelled through setsockcreate, one I05 channel per generation, qualification of each peer against its cited expected identity at accept and per-frame custody (SO_PEERPIDFD, the retained /proc/<pid> directory, the process label, cgroup and start time, the credentials), the 2-second answer bound with the R10-defined ANSWER_LATE, the I07 single writer session, the expiry schedule and a single-threaded epoll loop with ports for HE-003B and HE-003C. The writer's executable check is decided but not built here (Q-HE3A-1b (a)). No binary links the substrate yet (HE-003D)."
