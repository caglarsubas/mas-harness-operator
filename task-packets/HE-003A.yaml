contracts: ["Accepted base is main 17cd094004bdc13f748775bdf773604d5e8a3e62, tree 7777f19da022ef645257a0aa10d6f171d3461b61, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S and HE-002C-F. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. No contract file changes: the 15 files stay pinned in tools/gate.py and PROVENANCE.md is unchanged.","gate-sys gains crates/gate-sys/src/channel.rs, the third file allowed unsafe (Linux only): exactly socket, bind, listen, setsockopt, getsockopt, recvmsg, sendmsg, epoll_create1, epoll_ctl, epoll_pwait, ppoll and syscall (accept4 only through syscall, 288 on x86_64 and 242 on aarch64, so musl's fallback to the killed accept is never reached), each call with its own SAFETY argument, repr(C) layouts asserted per target, constants pinned with their evidence; and the portable crates/gate-sys/src/peer_wire.rs (the exact control buffer, exactly one credentials and one security message, labels, the stat start time, cgroup line sets). Dir::file opens with O_NONBLOCK and O_NOCTTY (Q-HE3-4 (a), closing HE-002C's R1-5), Dir::sub opens a subdirectory, and Dir and FileStores get Debug impls that format no descriptor.","effect-gate gains substrate.rs, linux_os.rs (its constructor takes &Sealed) and peers.rs (the cited expected peers, Q-HE3A-3 (a)), read-only model accessors, Event::AnswerLate and PolicyEvent::WAnswerLate (HELD in every state, the gate's own reason, Q-HE3A-2 (b)), and ANSWER_LATE in the journal decoder. The substrate derives the channel state from the model, uses the generation's one channel on a deviation before the first frame (Q-HE3A-4 (a)), maps every output to an action, treats a failed send as channel loss, fails closed with a LoopExit on any EventError, handles due deadlines first, and expires the bound run from the Lifetimes input (Q-HE3A-5 (a)). MODEL_DEFINED.md's HE-003A section records rules R31-R42, the owner decisions and the constants.","The gate's tripwires grow by reviewed rules (text, not Rust): unsafe and the fd items allowed in channel.rs with its exact foreign items; the start-up lint's exceptions as a per-file list of exact expressions (the status read in seal.rs; Dir::at(\"/proc/thread-self/attr\") and Dir::at(&format!(\"/proc/{}\", pid)) in channel.rs), each allowed once; derive(Debug) refused on any type whose fields mention File, Dir, FileStores, Conn, Listener, Poller, PidFd or ProcDir; HE-002C's R3-2 (1)-(4) workspace shape, an edition key in a target table included; and, as before, a top-level std group or glob and a nested std::...::* glob are refused, while type aliases and qualified paths such as <T>::f stay with code review (R3-3). tools/test_gate.py adds a case per rule. No readlink or readlinkat appears in the Rust sources. No harness-onion model or validator code or comment text is copied: an 8-word span search finds no shared span.","cargo test drives the substrate through a fake Os and fake ports (channels, expected identity, every custody rule, datagrams, both output tables, deadlines and the order of a wake, expiry, the 2-second bound on I05 and the synchronous I07 answers, the I07 session, send failures) and tests the parsers with fixed byte vectors. The Linux behaviour of channel.rs and linux_os.rs, the constants from the kernel headers, the labels, the custody of the real broker and writer and the bound under load are T04's. HE-002's, HE-002B's, HE-002C's (as HE-002C-F left them) and HE-002S's test files are byte-identical and every earlier test passes. This packet does not change ci/, so no per-head owner approval is needed."]
deliverables: ["crates/gate-sys/src/channel.rs and peer_wire.rs, the openat.rs changes, crates/effect-gate/src/substrate.rs, linux_os.rs and peers.rs, the gate, policy-gate, types, frame and file-store changes, the new tests, MODEL_DEFINED.md's HE-003A section, and the gate's new rules with their self-test cases."]
excluded: ["The I04 TLS server and HTTP (HE-003B); the upstream client and the real 900-second and 10-second timers (HE-003C); the gate binary's main, the signed configuration, the Lifetimes source and the seal call site (HE-003D); the writer's executable check and its seccomp amendment chain (Q-HE3A-1b (a)); the unit, SELinux policy and runtime directories (HE-008); the Linux runs (T04); ci/, the cargo config, Cargo manifests, the toolchain, contract files and downloads."]
