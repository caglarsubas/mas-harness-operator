contracts: ["Accepted base is main 47522704acd5f78faa4e8ccdb28300566a827baf, tree 9e4152a9a56d2758f8c87fdd931b70de8f375b6c, holding every R10 packet through HE-004-I01B2. Inherit the nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate's rules inside its self-test. No contract file, ci/ path, Cargo file or vendored package changes (63 contracts, the zero-bill list unchanged), and nothing is downloaded.", "i01_answer is a pure logic module under the logic and no-panic rules, with its own whitelist (the I01 logic paths plus kernel_text's utc_text and utc_seconds). derive keeps every per-key derivation result and errs only for an unbuildable Derived. Derived is closed (G-I01B-9 (i)-(vii): one brace struct deriving only Debug, its one literal as derive's tail, one impl of exact getters, fields read only through getters, no alias, six name positions, impls at the top level). refusals is the one composition of the model's answer lists (derivation, then capture gate, then comparison). answer checks the request binding, refusals, the record digest, one clock reading with every window and the rollback, assembles the 14 members, applies VPO's observation rules without the chain rules, and bounds the bytes at 65,536; self_check keeps VPO's decision and rule order and returns the first failing rule's label. Every text is a pinned const (14 VPO labels cited at f9882c1a, three R10-defined), every refusal names a const or a binding (G-I01B-8 (t1)-(t7)), and the only non-text literals come from sha256::prefixed and ZERO_DIGEST.", "Gate rules: G-I01B-1's I01B3 form (module_isolation's union construction over the four unreachable modules, plus the direction clause (e)), G-I01B-9, G-I01B-8's I01B3 checks, G-I01B-7 (six i01_ sources, 39 modules), G-I01-5's I01_FILES, the i01_answer whitelist and R-B3-PIN's i01_answer.rs pin with its file-form and casefold clauses. Every planted form of the design and its three reviews is a self-test (57 rows), refused by its own sub-clause, with a mutation proof recording each row's refusing set. The complete positive through answer equals the triple's observation with exactly observerBootId and expiresAt replaced (Q-I01B3D-3 (a')); R1-6 runs through refusals; W3's 18 rows and PV's v1 document rows replay through i01_answer. MODEL_DEFINED records R197-R210, the four-part binary proof (source isolation, the four-module symbol check, planeon-gate byte-identical, and the removal diagnostic) and the items carried to HE-004-I01B5 and HE-008. The 14 VPO labels are the only harness-onion text pinned, each cited; an 8-word span search against thirteen baselines, contract text excluded, finds no shared span."]
