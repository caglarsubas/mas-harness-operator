s own case and for W3's derived case on S1's v2 triple. MODEL_DEFINED records R184-R196, the sealed values' fail-closed argument with its two anchors, and the items carried to HE-004-I01B3 and HE-008. No harness-onion model or validator text is copied: an 8-word span search against thirteen baselines, contract text excluded, finds no shared span."]
