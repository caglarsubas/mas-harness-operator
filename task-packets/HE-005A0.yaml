contracts: ["Accepted base is main f4b05e9c553ed3ecdc983aed43127d79043cf664, tree a9b976f969ddb96e48f855e8144dff8d9d0d0e87, holding every R10 packet through HE-004-I01B5. Inherit the nine commands unchanged and in order and add none: the role-seal crate's tests run inside cargo test and the gate's rules inside its self-test. No contract file, ci/ path or vendored package changes (63 contracts, the zero-bill list unchanged); the workspace gains one member (crates/role-seal) and Cargo.lock gains path entries only, with no registry crate; nothing is downloaded.", "The move: crates/role-seal (std-only, #![forbid(unsafe_code)], one path dependency, gate-sys) holds the observer's role-neutral seal helpers (the capability words, the sock_fprog length, the prctl argument vectors with no BoundingDrop or AmbientClearAll, the Threads: parser, the bounding read, the TSYNC return), the SealStep/SealFailure/SealError types, the SealOps engine (crate-private) and its fake-kernel tests, and the concrete Linux stages over gate-sys parameterised by a role specification, so the Stage1 and Sealed tokens come only from real gate-sys calls (effect-gate's D6). The observer's seal.rs keeps its role specification (CAP_NET_ADMIN, CAP_BPF, KEPT), its two embedded OBSERVER programs and Arch, and its public seal_stage1/seal_stage2 and every public name its tests and pinned files use, through re-exports; main.rs, linux_listen.rs, linux_net.rs, linux_capture.rs and every pinned file stay byte-identical.", "The proof that the move is pure, by script (MON-HE005A-PLAN): every moved item's tokens equal before and after apart from the path or crate qualifiers; no item added or dropped; D6's private engine proven by the item-set rule's own failing test.", "Gate rules: crates/role-seal joins OBSERVER_LINKED_CRATES (the exact-set check), SCANNED_CRATES, OBSERVER_POST_SEAL_CRATES, the no-panic, Debug, print, macro and code-before-main rules, CRATE_ROOTS and the SBOM set; the workspace shape has 12 members