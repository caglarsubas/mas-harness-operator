objective: "Add the effect gate's I07 v3 PolicyGate as std-only Rust over the HE-002 I05 gate (harness-onion W03 plan v2, item HE-002B, obligation I07-4; owner decisions Q-HE2B-1 (a) and Q-HE2B-2 (a), 2026-10-13, via the lane monitor): the closed policy-kind table, classification, the write check, rendering, the request digest and write-outcome finality (policy.rs), and PolicyGate (policy_gate.rs), which owns the unchanged Gate and adds the writer session, lockstep, the four operations, the maintenance state machine, the outstanding write with its upstream outcome (delivered, lost, or the logical 10-second expiry), the I07 journal records and their restart rebuild, reproducing every I07 v3 kind, render and outcome check and every transcript. No sockets, no timer, no durable store; the binaries are unchanged."
