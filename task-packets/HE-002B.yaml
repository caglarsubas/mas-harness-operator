contracts: ["Accepted base is main 7b9e95a3b85b90e40643c8a61a6511cc0497d566, tree 7957f0056db9785700169845a48932bede743571, holding HE-000, HE-000B, HE-001 and HE-002. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test.","No new contract file and no gate change: the four I07 v3 files (README, schema, policy kinds, vectors) and the I07 v1 and v2 READMEs were registered in harness-onion's operator -> harness-engineering buildArtifact edge record at 93d32e1cc5125b5878f51de31c61ada29e1fa6da and are pinned by sha256 in tools/gate.py since HE-002 (13 registered contract files in all). No harness-onion model or validator code or comment text is copied: an 8-word span search of the files this packet adds or changes against the I05 and I07 models and validators at a2eab93, contract text excluded, finds no shared span.","Implementation from the pinned contract set: where the READMEs are silent the pinned I07 v3 model (scripts/i07_policy_write_v3.py at a2eab93, sha256 6cc7ea0d3df0c7f2966184bb6d322189de3b49b5b02dfe2429911121973afe08) is specification, each such point listed in host-enforcement/crates/effect-gate/MODEL_DEFINED.md's I07 section with its model line; R10-defined behaviours R13-R18 (a response beyond a schema bound ends the session before its operation; refusals leave the snapshot unchanged; typed upstream responses; policyWriter parsed by PolicyGate while the I05 Config still refuses it; saturating counters and the write-map bound; fail-closed fallbacks) are listed there too. Owner decision Q-HE2B-1 (a), 2026-10-13: PolicyGate follows the model's operation decomposition and per-operation order, which the I07 v3 vectors make normative, written independently in Rust with R10's own types; the Q-HE2-R1 disclosure covers it (MODEL_DEFINED.md, Correspondence).","Composition, not inheritance: PolicyGate owns the HE-002 Gate and reaches it through crate-private access only; the I05 public API, Config and every I05 behaviour are unchanged, and GATE_RESTART passes no floor to restart_with. The new Invalidation variant WRITER_PEER_DEVIATION and the I07 journal records join the one in-memory journal in the tuple form of the HE-002B design; their byte format is HE-002C's.","Owner decision Q-HE2B-2 (a), 2026-10-13: HE-002B owns only the logical expiry of the 10-second write bound (the TIMEOUT event, its WRITE_TERMINAL IO_AMBIGUOUS record with aborted UPSTREAM_TIMEOUT, the generation HELD and the IO_AMBIGUOUS answer, as transcripts T59, T61 and T62 pin); the real I07 write timer and the I07 apiserver HTTP/TLS client belong to HE-003, recorded as an obligation-register amendment of the W03 plan in the next harness-onion meta packet that touches the plan.","cargo test replays every I07 v3 vector family not covered by HE-002: 79 kind, 7 render and 22 outcome checks and the 62 transcripts on both the value and the byte path (73 FRAME and 195 W_FRAME events, no byte-path fallback), plus R10-local I07 vectors whose expected values come from the pinned model and which close the contract vectors' coverage gaps, unit tests for R13-R18 and a bounded seeded robustness run. HE-002's tests/vectors-local.json and tests/local_vectors.rs are byte-identical and every HE-002 test passes. This packet does not change ci/, so no per-head owner approval is needed."]
deliverables: ["policy.rs and policy_gate.rs in crate effect-gate with the gate.rs, journal.rs, types.rs and lib.rs changes, MODEL_DEFINED.md's I07 section and extended Correspondence, the I07 replay, the R10-local I07 vectors, the R13-R18 unit tests and the robustness test."]
excluded: ["Sockets, custody and the real timers (the 10-second I07 write timer and the 2-second answer bound) and the I05 and I07 apiserver HTTP/TLS clients (HE-003); the durable journal and failure-marker stores and their byte format, including the I07 records (HE-002C); the process seal and seccomp installation (HE-002S); the writer artifact and enrollment; linking the libraries into a binary; tools/gate.py, contracts, ci/, the cargo config and workspace, the toolchain or closure table; downloads."]
