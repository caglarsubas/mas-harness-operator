id: "HE-001"
repository: "mas-harness-operator"
branch: "codex/he-001-host-enforcement-scaffold"
objective: "Add the W03 host-enforcement scaffold: a Rust workspace under host-enforcement/ built offline with the pinned official Rust 1.99.0 toolchain (owner decision VX3 (a)) into static binaries for x86_64-unknown-linux-musl and aarch64-unknown-linux-musl, host-run unit tests, the toolchain pin, a reviewed closure classification table for every shipped toolchain file (owner decision Q-HE1 (a)) and an in-repo stdlib gate. No module logic, no external crates, no ci/ change."
predecessors: ["HE-000B"]
allowedPaths: [".cargo/config.toml",".gitignore","host-enforcement/Cargo.lock","host-enforcement/Cargo.toml","host-enforcement/README.md","host-enforcement/crates/broker/Cargo.toml","host-enforcement/crates/broker/src/main.rs","host-enforcement/crates/containment/Cargo.toml","host-enforcement/crates/containment/src/main.rs","host-enforcement/crates/gate/Cargo.toml","host-enforcement/crates/gate/src/main.rs","host-enforcement/crates/host-common/Cargo.toml","host-enforcement/crates/host-common/src/lib.rs","host-enforcement/crates/observer/Cargo.toml","host-enforcement/crates/observer/src/main.rs","host-enforcement/crates/writer/Cargo.toml","host-enforcement/crates/writer/src/main.rs","host-enforcement/licenses/closure-1.99.0.json","host-enforcement/toolchain.json","host-enforcement/tools/gate.py","host-enforcement/tools/rust-lld","host-enforcement/tools/test_gate.py","task-packets/HE-001.yaml"]
warmSourceAccess: "PROHIBITED_DURING_IMPLEMENTATION"
sourceReuse: []
prefetchCommands: []
offlineExecution: {"wrapperArgv":["./ci/verify-offline.sh"],"packetPathEnvironment":"HARNESS_TASK_PACKET","packetPathMode":"HASH_PINNED_READ_ONCE_NO_CHILD_PATH","commandTransport":"ARGV_ARRAY_V1","isolation":"OS_ENFORCED_DENY_ALL_OUTBOUND","sessionScope":"SINGLE_PROCESS_TREE","prefetchOutsideSession":false,"offlineEnvironment":{"UV_OFFLINE":"1","UV_FROZEN":"1","UV_NO_SYNC":"1"}}
contracts: ["Accepted base is main 6417f5e6d8e97f6b28b6d844e424b9fe828dfe3f, tree fa31d992ddab32e19596f25bfa755984ae0ff3e7, holding HE-000 and HE-000B. Inherit their five commands unchanged and in order, then add, with every flag written out: the two musl release builds, cargo test for the host target, and python3 -I -B host-enforcement/tools/gate.py. Every later packet in this repository inherits all nine in order. Cargo uses the launcher's per-run home and writes only the untracked host-enforcement/target/.","The repository-root .cargo/config.toml sets [net] offline = true and, for both musl targets, the linker host-enforcement/tools/rust-lld with -C link-self-contained=yes and -C target-feature=+crt-static at the targets' default relocation model. tools/rust-lld is a small sh wrapper (an assignment, an export and an exec) that sets DYLD_FALLBACK_LIBRARY_PATH to the pinned sysroot's lib/ and execs the pinned rust-lld, which needs libLLVM.dylib from there (the variable set through cargo's [env] did not reach the linker in the local simulation). The workspace has six crates (host-common and five planeon-* binaries that parse argv and exit), edition 2024, Apache-2.0, a lock with only workspace crates, no build script and no proc-macro; release profile panic=abort, lto, codegen-units=1, debug=0, strip=debuginfo.","host-enforcement/toolchain.json records the toolchain pin and is the only record of each target's ELF shape. tools/rust-lld (sysroot and host), the table's file name (release) and the .comment markers repeat parts of the pin, and the gate checks each against toolchain.json. The pin: rustc 1.99.0 commit b940084d7eb6a299eb4bfeb8e34901bc051e7ac4 with LLVM 23.1.1, cargo 1.99.0 (5f94df478 2026-08-27), host aarch64-apple-darwin (Darwin-only until Linux qualification), sysroot /opt/planeon/toolchains/rust-1.99.0; x86_64 static-pie and aarch64 static ET_EXEC, so its executable image is not randomised (no static-pie default at 1.99.0, confirmed by the local link; owner decision D3 (a) on design-review finding D3, relayed by the lane monitor on 2026-10-11: accept and record, forcing static-pie is left to a later packet); and the Command Line Tools dependency (Apple clang 14.0.3, SDK 13.3) that cargo test needs on the host (owner decision Q-HE2 (a)).","host-enforcement/licenses/closure-1.99.0.json, sha256 e085f1b784c1635b609734575d23d858beaffdd5b8b63a7fce585a38984e54a1, classifies all 136 regular files under lib/rustlib/<target>/ of both musl targets (role, component, source, license, outcome). It was generated by the operator tool generate_table.py (sha256 4cb958a6520141269d7faa026581edba1f3f77dd84724e25f1dfcd09b4aaffb8) from harness-onion a5a0625e68c39ee5c80cd17841ccf3cecd2a6cda with the pinned classifier scripts/license_amendment.py 58758a4a7bb6bbcf49daf1880cc423566da306cfd90dceadfa1b4b7c53ec28cd, amendment f6a8c0796857cf40906df3e6bc483122988b91271cc77b3aaed4d4e213d864c2, vectors fd2af21605c04420f76d148b71cf39e026251931df215e77eafce8c925549b24, base policy fa3a4398acafc3960eaaae9f5396d4e96d91e6ff252b83f6c53e1f5f0d8a40d0 and safe_yaml 99c673560e65e58cdc1abe86e53472feaf93e546dd76cb9f3ba051beef5c49d7, over the offline evidence set whose manifest is 21143aeb3dac4e84e94e8cb12b6f6f95117cdadb9e9fe48b244b1327345f0ac1. No harness-onion code is copied into this repository. Every outcome is accepted. A later table change needs a new packet with a regenerated, independently reviewed table.","The gate (stdlib only; every output line starts with 'he-gate: ') first runs its self-test in-process, then checks: rustc (release, commit, host, LLVM version), cargo, sysroot and target libdirs against toolchain.json and the Command Line Tools path (a different version is printed, not failed); the repository-root cargo config (offline, exactly the two targets, the wrapper and the static flags) and that the wrapper execs <sysroot>/lib/rustlib/<host>/bin/rust-lld of toolchain.json; the workspace and lock; the table digest and every shipped file against its row in both directions; compiler-rt's crtbegin/crtend markers (not GCC's) in all four crt objects per target; each binary's e_machine, shape, no PT_INTERP, no writable and executable PT_LOAD, a non-executable PT_GNU_STACK, .comment lines naming rustc 1.99.0 (b940084d7 and LLD 23.1.1 (both derived from toolchain.json) and no build-host path; the start-up lint over every workspace .rs file outside host-enforcement/target/; and it writes one deterministic CycloneDX 1.5 SBOM per binary and target (serial number: an RFC 4122 version-5 UUID of the content), printing each binary's and SBOM's sha256.","This packet does not change ci/, so the verifier needs no per-head owner approval for it."]
deliverables: ["The host-enforcement workspace, toolchain pin, linker wrapper, reviewed closure table, gate and self-test, README rules and limits, and four inherited acceptance commands."]
excluded: ["Module logic (HE-002 to HE-007); external or vendored crates; ci/, the four transport contract files, Makefile, the OP descriptors, PORTING.yaml and the root Go module; the host image, runc/containerd SBOMs, NOTICE files, license texts and source offers (HE-008); native traces (T04); installed launcher, policy, toolchain, verifier or keys; workflows; downloads."]
offlineAcceptanceCommands: [["python3","-I","ci/network_canary.py"],["go","vet","./..."],["go","test","./..."],["python3","-I","-B","ci/zero_bill_scan.py","."],["python3","-I","-B","-m","unittest","discover","-s","tests/verify","-p","test_*.py"],["cargo","build","--locked","--offline","--frozen","--release","--manifest-path","host-enforcement/Cargo.toml","--target","x86_64-unknown-linux-musl"],["cargo","build","--locked","--offline","--frozen","--release","--manifest-path","host-enforcement/Cargo.toml","--target","aarch64-unknown-linux-musl"],["cargo","test","--locked","--offline","--frozen","--manifest-path","host-enforcement/Cargo.toml"],["python3","-I","-B","host-enforcement/tools/gate.py"]]
expectedEvidence: ["verify from the owner-operated verifier v4: transport bound (packet header, nine argv lines, no prefetch); the five inherited commands passing; both musl builds and the host tests passing; the gate printing 'he-gate: passed' with ten binary and SBOM digests; tracked files unchanged."]
rollback: "Never removed or reverted (AGENTS.md rule 2): a fix is a new packet."
