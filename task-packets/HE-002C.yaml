objective: "Make the effect gate's journal and failure marker durable files (harness-onion W03 plan v2, item HE-002C; owner decisions Q-HE2C-1 (a), Q-HE2C-2 (a), Q-HE2C-3 (a) and Q-HE2C-4 (a), 2026-10-13, via the lane monitor): a framed, digest-checked record format with a two-phase append and revocation, the journal and marker stores and the generation index (store.rs, frame.rs, file_store.rs), the open and restart paths of Gate and PolicyGate over them with an exact in-process mirror, and one audited unsafe module, crate gate-sys (openat-based directory-relative opens, no symlink following, close-on-exec, regular-file checks, advisory locks), to which every unsafe line is confined. No sockets, no timer, no binary change: no binary links the stores yet."
