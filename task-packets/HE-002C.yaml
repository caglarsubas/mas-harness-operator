contracts: ["Accepted base is main eebfd188358f41f36dba54c4dc7590390358120b, tree 6fc54f1938af4cbfded5f796adef4daf813fbf1a, holding HE-000, HE-000B, HE-001, HE-002 and HE-002B. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test.","No new contract file: the 13 registered contract files of harness-onion's operator -> harness-engineering buildArtifact edge record at 93d32e1cc5125b5878f51de31c61ada29e1fa6da stay pinned by sha256 in tools/gate.py. The gate gains reviewed lexical tripwires over the workspace's .rs files (text, not Rust): the sources linked into effect-gate, gate-sys and i05-protocol name no refused std path (a list of refused modules and items, not an allowlist of std modules: process, env, net, path, file openers, std::os outside the allowed fd and fs items, with the whitespace around :: removed; no std alias, std glob or top-level group, macro-completed std path or extern crate); the word unsafe appears only in crates/gate-sys/src/openat.rs; no source takes code from another file or uses a form the patterns cannot read (no path attribute, word include, raw identifier, inline assembly, symlink under crates/, manifest target path or build key), and crates' src/ hold only .rs files; the crate roots forbid or deny unsafe_code, which the compiler enforces, and any form beyond the tripwires is code review's. tools/test_gate.py adds a refusal case per form. No harness-onion model or validator code or comment text is copied: an 8-word span search of the files this packet adds or changes against the I05 and I07 models and validators at a2eab93, contract text excluded, finds no shared span.","The record format and the store rules are R10-defined (the contracts leave the byte format to the gate): a frame is a fixed 146-byte header (magic, payload length, payload and header digests) and a payload, with a status byte that is pending until committed; Q-HE2C-1 (a), 2026-10-13: a two-phase append (the frame, synced and read back; then the commit byte, synced and read back) and revocation on failure, the residual window extending the disclosed I05 v2 P4 / v3 V3 residual by one case. R19-R30 (names, bounds, undecodable payloads, the marker's fail-closed form, index integrity, devices, a single writer, the durability order, I/O errors as values, the newest generation only, revocation, no overlapping generations) are listed with their reasons in host-enforcement/crates/effect-gate/MODEL_DEFINED.md's HE-002C section; Q-HE2C-4 (a), 2026-10-13: the two points where the build is stricter than the design stand, fail closed (a committed marker counts only with reason STORAGE_FAILURE, otherwise UNREADABLE; an index or earlier-generation journal that cannot be read whole refuses the open).","Restart: Gate::open and PolicyGate::open rebuild from the journal and take GATE_RESTART's path; Q-HE2C-2 (a), 2026-10-13: the earlier bindings are the union of the configuration's priorBindings and the bindings derived from earlier generations' journals; Q-HE2C-3 (a), 2026-10-13: the pinned model's order is kept (expired set before the EXPIRED write), so after a failed EXPIRED write and a process restart a later EXPIRE journals EXPIRED again (outputs and state equal, one extra record), amending HE-002 design section 7's identical-journal claim for this case. The I05 and I07 public APIs keep every behaviour; create and open constructors are added.","cargo test runs every I05 v3 and I07 v3 transcript, S01-S06, the R10-local vectors and two new R10-local I07 vectors (expected values from the pinned I07 v3 model, sha256 6cc7ea0d3df0c7f2966184bb6d322189de3b49b5b02dfe2429911121973afe08) through files in lockstep with the in-memory gate, comparing the mirror and a fresh file scan after every event; every transcript with a GATE_RESTART as a real process restart (as is, +EXPIRE and +DRAIN_REQUEST), where only R10-L02 and R10-L02b +EXPIRE differ, by Q-HE2C-3's one record; every append failure point; R19-R30 with real files; and gate-sys host tests. HE-002's and HE-002B's test files are byte-identical and every earlier test passes. This packet does not change ci/, so no per-head owner approval is needed."]
deliverables: ["store.rs, frame.rs and file_store.rs in crate effect-gate with the gate.rs, policy_gate.rs, journal.rs and lib.rs changes and MODEL_DEFINED.md's HE-002C section; crate gate-sys (openat.rs and its host tests) joining the workspace and Cargo.lock without a registry package; the durable-store, restart and suite tests; the two R10-local I07 vectors; the gate's source check and its self-test cases."]
excluded: ["Sockets, custody and the real timers and the I05 and I07 apiserver HTTP/TLS clients, and linking the stores into a binary (HE-003); the process seal and seccomp installation (HE-002S); the marker's failure-domain proof beyond the device check (HE-008, T04); contracts, ci/, the cargo config, the toolchain or closure table; downloads."]
