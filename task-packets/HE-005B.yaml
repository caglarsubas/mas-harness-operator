ocol and std paths limited to a whitelist; PR review round 1's R1-3 and R1-4), BROKER_LINKED_CRATES exactly {broker, role-seal, gate-sys, i05-protocol}, CONTRACTS 69 and the include rule (seal.rs exactly the two BROKER programs, i02.rs exactly the channel schema, no broker source naming vectors.json), the GateQualified token (R240's five clauses in G-D2-8's form with resolved_uses), and per built broker no symbol of the four modules; every new rule has failing self-test rows, and the 81 rows the proof fixture can hold have their disabled-clause proof rows in HE005B_PROOF_RULES.", "Binaries: planeon-gate, planeon-observer, planeon-containment and planeon-writer and their SBOMs stay byte-identical to HE-005A's. planeon-broker's bytes change (x86_64 18589a172ec196477138c341028a4b14804e3ac3d2dfb9701bd36317c1a24f5d, aarch64 dbd3293d5d32cf26d224b61393c33110017e9323dbc413acd4781eff2f571747); its SBOM differs from HE-005A's in the i05-protocol workspace component and in the binary digest it records, with its serialNumber (addendum 1's SBOM check applies only to an identical binary); with the four pub mod lines and the i05-protocol edge removed the build is byte-identical to HE-005A's, the residual MODEL_DEFINED records in I01B3's form. a second clean build (the sim) reproduces all ten binary lines; MODEL_DEFINED records the HE-005B section (R246-R307, R307 the H5G-4 conflict, resolved by harness-onion EDGE-V13 for HE-005D), the carried list and the evidence."]
