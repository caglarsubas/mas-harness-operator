contracts: ["Accepted base is main 7743e55748147a6a0501ce72c88e4dbd4aafde3a, tree 95badd02423999889ae4f0c570ea7ad1de6adad4, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F and HE-003A..D. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test.","Two new contract files, host-enforcement/contracts/seccomp-v4/EFFECT_GATE.{aarch64,x86_64}.bpf, byte-identical to harness-onion's architecture/compiled-filter-programs-v2/programs/ (MET-ENFORCE-029, merged as d2ef7083; the pinned v4 model's output: v3's program plus exactly one six-instruction readlinkat block) and registered REGISTERED_BEFORE_USE for HE-003A2 in the operator -> harness-engineering buildArtifact edge record v3; the seal embeds and installs them (200 and 189 instructions). The v3 files stay byte-identical, pinned but no longer embedded (Q-A2-1), so the 17 contract files are pinned by sha256 in tools/gate.py and recorded in contracts/PROVENANCE.md.","The check (Q-A2-2, -6): gate-sys's Dir::read_link calls musl's readlinkat wrapper (its pinned libc.a member issues the system call with the descriptor unchanged and no fallback) on the retained /proc/<pid> directory with the one relative name exe, so AT_FDCWD and absolute names cannot reach it; peers::writer_exe_matches compares exact bytes; LinuxOs takes the enrolled path as a required argument and the substrate checks I07 connections at accept (after the label and uid comparison, before the pidfd probe) and in every frame's custody; the gate's readlinkat leaves the killed-wrapper list, re-derived over the v4 programs by a kept classifier.","Configuration format v2 (Q-A2-5): the format string and signing domain become planeon.effect-gate-config/v2 and a top-level enrolledWriter.executable is required (absolute, normalised, ASCII without control characters, at most 255 bytes, not ending in ' (deleted)'); a v1 document is refused; the compiled-in signer key stays empty until HE-008, so every document is still refused in production.","Gate and model record: tools/gate.py adds readlinkat to openat.rs's foreign items, a rule that the word read_link occurs exactly at its definition and the exe call in channel.rs, readlinkat pinned to its two occurrences in openat.rs, and HE-003D N1's extension (Fn/FnMut/FnOnce including path-qualified, parenthesised and higher-ranked forms, fn pointers and pub-enum variant field types in linux_os.rs and linux_net.rs, the residual named in R72), each with self-test cases; MODEL_DEFINED.md's HE-003A2 section records R79 onward, R36's extension, R37's closure with the path-name residual, the musl evidence and the HE-007/HE-008/T04 duties.","Declared earlier-test departures (Q-A2-10): effect-gate/tests/seal.rs (the v4 pins and doc line), gate-tls/tests/signed_config.rs and effect-gate/tests/gate_config.rs (the format version and the new member), and the Os fakes in effect-gate/tests/substrate_support/mod.rs (the method plus its exe_ok field and the field's two initialisers) and gate-tls/tests/tls_support/mod.rs (the method); every other earlier test file is byte-identical and every earlier test passes; the eight other binaries and SBOMs are byte-identical. There is no ci/ change. No harness-onion model or validator text is copied: an 8-word span search over R10's sources, vendor/ excluded, finds no shared span."]
deliverables: ["contracts/seccomp-v4/ and PROVENANCE; the seal's v4 embedding; gate-sys Dir::read_link and ProcDir::exe; effect-gate's writer check (peers, LinuxOs, substrate) and configuration format v2; the gate's new rules with self-test cases; the new tests; MODEL_DEFINED.md's HE-003A2 section."]
