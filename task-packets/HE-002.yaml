contracts: ["Accepted base is main d335f692f2f9c055b1bd7460e61abc18b8b261a7, tree b887afae0eee4de732ad0276772dde2a0aa0ceee, holding HE-000, HE-000B and HE-001. Inherit their nine commands unchanged and in order and add none: the new crates' tests run inside cargo test and the gate gains checks.","host-enforcement/contracts/ holds 13 harness-onion contract files byte-exact (the I05 and I07 v3 schemas, mapping, kinds and vectors, the v1-v3 READMEs and the I05 v3 supplementary vectors), each registered before use in harness-onion's operator -> harness-engineering buildArtifact edge record at 93d32e1cc5125b5878f51de31c61ada29e1fa6da (owner decision Q-HE2-A) and pinned by sha256 in tools/gate.py; PROVENANCE.md names repository, commit, path and digest. No harness-onion model or validator code or comment text is copied: an 8-word span search of the files this packet adds or changes against the I05 and I07 models and validators at a2eab93, contract text excluded, finds no shared span apart from a two-line hashing helper in tools/gate.py that HE-001 merged (PR review round 1, R1-1).","Implementation from the pinned contract set (owner decision Q-HE2-B): where the READMEs are silent the pinned models and validator lines are specification, each such point listed in host-enforcement/crates/effect-gate/MODEL_DEFINED.md with its file and line; R10-defined behaviours (a response beyond a schema bound closes the channel HELD and journalled; no panic on any input) are listed there too. i05-protocol has no counterpart in the models; effect-gate's Gate follows the model's decomposition into operations and the order of the checks inside each operation, which M17-M31 make normative, with R10's own types, data structures and R10-defined paths (MODEL_DEFINED.md, Correspondence; PR review round 1, R1-2).","Standard library only (owner decision Q-HE2-D): no dependency outside the workspace; SHA-256 tested against the NIST CAVP short, long and Monte Carlo vectors (shabytetestvectors.zip sha256 929ef80b7b3418aca026643f6f248815913b60e01741a44bba9e118067f4c9b8).","cargo test replays all I05 v3 vector families (5 configuration refusals, 34 frame, 14 byte and 42 agreement checks, 120 transcripts on both the value and the byte path), the six I05 v3 supplementary transcripts (S01-S06, closing AF2-I05-1, with their equals pairs) on both paths, the I07 v3 frame (48) and byte (9) checks, and the R10-local vectors (owner decision Q-HE2-E (a): the I05-4 replacement in both directions, the injection queue order, an expiry after a restart, and byte and agreement checks).","The gate additionally checks the registered contract files, that the repository-root cargo config holds only [net] and [target] (HE-001 review R2-1), that the linker wrapper starts with #!/bin/sh (R2-2), and lists in each binary's SBOM only the workspace crates in its dependency closure. R2-3 stays with the next closure-table regeneration. This packet does not change ci/, so no per-head owner approval is needed."]
