objective: "Build the effect gate's I04 server half (harness-onion W03 plan v2, HE-003's second part after owner decision Q-HE3-1 (a); obligations I05-3's server side and HI-10's C1-C7 share; owner decisions Q-HE3-2 (a) rustls with the ring provider, and Q-HE3B-1..27 (a), 2026-10-14/15, via the lane monitor): a TLS 1.3 mutual server (rustls 0.23.46, ring provider, no resumption, no early data, DER-only CA, ALPN http/1.1), HTTP/1.1 request framing and exact response rendering, connection stamping C1-C7, the I04 port in the HE-003A loop with the model-held connection flag, and the audited TCP module, with the 25 approved crates vendored. The upstream client is HE-003C's; main, the configuration and linking are HE-003D's, so no binary links gate-tls yet."
