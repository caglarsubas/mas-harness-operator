contracts: ["Accepted base is main 53c514faa9886448f4666cf5efc44fc5867df7cc, tree 12d766dac76965e275db56104903a591f98f749f, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F and HE-003A. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. No contract file changes: the 15 files stay pinned in tools/gate.py and PROVENANCE.md is unchanged.","Vendoring (Q-HE3B-1, -7, -8, -9, -11, -26): the 25 owner-approved crates are vendored under host-enforcement/vendor/, each with .cargo-checksum.json whose package equals its approved sha256. The 14 used crates' files are byte-identical to the approved archives' contents (modes normalised); the 11 lock-only crates are stubs whose kept files (manifest, licence files, files the manifest names) are byte-identical and whose library file is empty. They were fetched once before the build under Q-HE3B-1 (a), with the user's yes in the author's chat, and committed; no command downloads anything. licenses/vendor-crates.json pins every vendored file and is pinned in tools/gate.py; the sysroot closure table is unchanged.","Configuration and toolchain (Q-HE3B-3, -4, -23): .cargo/config.toml gains the [source] replacement and the [env] table (CC and AR per musl target = the Command Line Tools clang and ar; on x86_64 the no-libc-headers flag line); the release build-override keeps build scripts unstripped; toolchain.json pins the Command Line Tools clang 14.0.3, and the gate fails on a mismatch.","Code: gate-sys tcp.rs, the fourth audited unsafe module, with exactly eight foreign items (socket, setsockopt, bind, listen, recv, send, shutdown, and syscall for accept4) and inet.rs; effect-gate's stream table, Event::Disconnect, Port::failure checked after every event and call and before every wait, LoopExit::Port; and the gate-tls crate: the TLS 1.3 mutual server, HTTP/1.1 framing and rendering, the I04 port with its model-held flag, the exchange board, and the server key held in Zeroizing and handed to rustls first (§20).","Gate and model record: tools/gate.py adds the vendored-tree check, the cargo-configuration tables, the toolchain pin, the linked-crate list, tcp.rs's foreign items, the TLS deny-list with its exactly-once settings rule, and the secret-type Debug rule, each with self-test cases; MODEL_DEFINED.md's HE-003B section records R43-R58, R42's rewording and the build's crate-behaviour findings; NOTICE names the vendored crates and README points to the vendored source and the vendor table.","Unchanged and carried: HE-002's to HE-003A's test files are byte-identical and every earlier test passes; the ten binaries and SBOMs are byte-identical (no binary links gate-tls), so the SBOM evidence for the vendored crates and the vendored-source-path residual (design §18) are HE-003D's. There is no ci/ change, so no per-head owner approval is needed. No harness-onion model or validator text is copied: an 8-word span search over R10's sources, vendor/ excluded, finds no shared span."]
