id: "HE-003D"
repository: "mas-harness-operator"
branch: "codex/he-003d-gate-binary"
objective: "Build the effect gate binary (harness-onion W03 plan v2, HE-003's fourth part after owner decision Q-HE3-1 (a); SEC-4/HI-7's seal call site, the no-socket/thread-before-Sealed source check, the __membarrier link check; decisions Q-HE3D-1..13 and B1/A1/A2, 2026-10-15, by the owner and the lane monitor under the owner's delegation): planeon-gate's main seals in two stages with only the signed configuration read between them, then loads the pinned credentials, sets up the sockets, opens the stores bound to one signed document per generation, composes the I04 server and the upstream client and runs the loop, with a distinct exit status per failure point; an R10-defined signed configuration (RFC 8785 JCS subset, detached Ed25519 via the vendored ring, the public key compiled in and empty until HE-008, so every document is refused until then); the vendored crates as workspace path dependencies so no build-host path reaches the binary; and the gate rules that check all of it."
