contracts: ["Accepted base is main 5541314e93bcf68ec3d9e92154b112c46f99a8b6, tree 152f8dceebf7bc92dce47909fe3dd797a5609d3b, holding HE-000, HE-000B, HE-001, HE-002, HE-002B, HE-002C, HE-002S, HE-002C-F and HE-003A..C. Inherit their nine commands unchanged and in order and add none: the new tests run inside cargo test and the gate self-test. No contract file changes: the 15 files stay pinned in tools/gate.py and PROVENANCE.md is unchanged.","Host paths (Q-HE3B-27 (a), Q-HE3D-4 (a)): a [patch.crates-io] table maps exactly the 11 LINKED vendored crates to path dependencies under host-enforcement/vendor/, whose bytes are unchanged; the directory source stays for the stubs and build-host crates; the patched packages lose source and checksum in Cargo.lock, so tools/gate.py's vendor table (unchanged, pinned) is their file-level pin; gate-tls gains ring =0.17.14 (already vendored) and a gate-sys path dependency. No package is added, removed or updated, and nothing is downloaded.","Signed configuration (Q-HE3D-1, -5..-8, -10, -13): /etc/planeon/effect-gate/config.json and config.json.sig (64 raw bytes), Ed25519 over a domain-separated payload with the public key compiled in from crates/gate-tls/config-signer.pub, which is empty until HE-008 (every document refused; small-order keys refused; the key passed through core::hint::black_box so the shipped binary keeps the composed gate); verified before parsing; an RFC 8785 JCS subset; closed schema; checks incl. port >= 1024, empty observedWorkers (Q-HE3D-2), lifetimes for exactly the runs, one serving CA and one I04 client CA; credentials read after the seal, each pinned by sha256 into a buffer allocated once; one signed document per generation through FileStores::open_bound's <generation>.document frame, amending HE-002C's store rules R19-R30 (Q-HE3D-13 (b)).","Binary and gate: planeon-gate joins the linked crates with an exact ExitCode allowance; tools/gate.py adds the seal-order grammar over main.rs, the socket-module and thread rules, refusals of code before main and of print and stdout/stderr, the signer-key size rule, the no-membarrier check, the inventory of killed-call wrappers with reviewed justifications, the presence of gate_tls, rustls and ring symbols in planeon-gate, the open_bound and single gate_sys::Dir rules, the TLS deny-list and secret-type rules over the binary, HE-003C R1-1's any-mention rule and with_root_certificates, and the [patch] and lock rules, each with self-test cases; MODEL_DEFINED.md's HE-003D section records R69 onward, R65 and R67 reworded, and the carried lists.","Unchanged and carried: earlier test files are byte-identical and every earlier test passes; the eight other binaries and SBOMs are byte-identical; planeon-gate's binary and SBOM change and its SBOM lists exactly the 11 LINKED vendored crates. There is no ci/ change, so no per-head owner approval is needed. No harness-onion model or validator text is copied: an 8-word span search over R10's sources, vendor/ excluded, finds no shared span."]
deliverables: ["planeon-gate's main; effect-gate gate_config.rs, status.rs and FileStores::open_bound; gate-tls signed_config.rs and credentials.rs with the empty config-signer.pub; the embedded I07 policy-kinds table; the [patch] table and lock; the new tests; the gate's new rules with self-test cases; MODEL_DEFINED.md's HE-003D section; README and NOTICE."]
excluded: ["The enrollment signer, its key and the packet that sets config-signer.pub, the configuration and credential files, their labels and types, and the unit (HE-008); the writer executable check and configuration format v2 (HE-003A2); the observedWorkers source (an I05 successor and a matrix grant); the Linux runs (T04); ci/, contract files, dependencies and downloads."]
